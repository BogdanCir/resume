services:
  localstack:
    image: localstack/localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb
      # - DEFAULT_REGION=eu-north-1
    volumes:
      - ./aws/lambda/init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./aws/lambda
    ports:
      - "9000:8080"
    environment:
      - DYNAMODB_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=eu-north-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      localstack:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_VISITOR_API_URL=/lambda
      - LAMBDA_PROXY_TARGET=http://backend:8080
    volumes:
      - ./src:/app/src
    depends_on:
      - backend
